version: "3.9"

services:
  rabbitmq:
    build: ./docker/rabbitmq
    container_name: med-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: med-prometheus
    restart: always
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana-oss:latest
    container_name: med-grafana
    restart: always
    ports:
      - "3008:3000"
    volumes:
      - grafana_data:/var/lib/grafana

  redis:
    image: redis:8.2-alpine
    container_name: med-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mailhog:
    image: mailhog/mailhog:latest
    container_name: med-mailhog
    restart: always
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  prometheus_data:
  redis_data:
  rabbitmq_data:
  grafana_data:
