version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:4.1
    container_name: med-rabbitmq
    build: ./docker/rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: myuser
      RABBITMQ_DEFAULT_PASS: mypassword
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # Database cho Account-service
  db-account:
    image: postgres:17
    container_name: med-db-account
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: account_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5435:5432" 
    volumes:
      - postgres_account_data:/var/lib/postgresql/data

  # Database cho Scheduling-service
  db-schedules:
    image: postgres:17
    container_name: med-db-schedules
    restart: always
    environment:
      POSTGRES_USERNAME: postgres
      POSTGRES_HOST: localhost
      POSTGRES_PASSWORD: 1
      POSTGRES_DB: schedules_db
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "5433:5432" 
    volumes:
      - postgres_schedules_data:/var/lib/postgresql/data

volumes:
  postgres_account_data:
  postgres_schedules_data:
  rabbitmq_data: {}