global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: 'account-service'
    scrape_interval: 10s
    static_configs:
      - targets: ['account-service:3001']

  - job_name: 'scheduling-service'
    scrape_interval: 10s
    static_configs:
      - targets: ['scheduling-service:3002']

  - job_name: 'notification-service'
    scrape_interval: 10s
    static_configs:
      - targets: ['notification-service:3003']
